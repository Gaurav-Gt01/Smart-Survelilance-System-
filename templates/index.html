<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
        }

        h1 {
            padding: 20px 24px;
            font-size: 18px;
            font-weight: 500;
            border-bottom: 1px solid #222;
        }

        .layout {
            display: flex;
            gap: 20px;
            padding: 20px 24px;
        }

        .left {
            flex: 1.4;
        }

        .right {
            flex: 1;
        }

        h2 {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 12px;
        }

        #live-feed {
            width: 100%;
            border-radius: 10px;
            background: #111;
        }

        .log-entry {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border-bottom: 1px solid #1e1e1e;
            padding: 10px 0;
        }

        .log-entry img {
            width: 72px;
            height: 54px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .log-meta {
            font-size: 12px;
        }

        .log-time {
            color: #888;
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-human {
            background: #1a3a5c;
            color: #7db8f7;
        }

        .badge-animal {
            background: #2a3a1a;
            color: #8fc96a;
        }

        .badge-unknown {
            background: #2e2a1a;
            color: #c9a34a;
        }

        #log-container {
            max-height: 70vh;
            overflow-y: auto;
        }

        .status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            background: #1a3a1a;
            color: #6fcf97;
            display: inline-block;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <h1>Smart Surveillance Dashboard</h1>
    <div class="layout">
        <div class="left">
            <h2>Live feed</h2>
            <img id="live-feed" src="/video_feed" alt="Live camera feed">
            <div class="status" id="status">● System active</div>
        </div>
        <div class="right">
            <h2>Activity log</h2>
            <div id="log-container"></div>
        </div>
    </div>
    <script>
        function badgeClass(c) {
            if (c === "Human") return "badge-human";
            if (c === "Animal") return "badge-animal";
            return "badge-unknown";
        }

        async function loadEvents() {
            const res = await fetch("/events");
            const events = await res.json();
            const container = document.getElementById("log-container");
            container.innerHTML = events.map(e => `
        <div class="log-entry">
          <img src="/image/${encodeURIComponent(e.image_path)}" alt="capture">
          <div class="log-meta">
            <div class="log-time">${e.timestamp}</div>
            <span class="badge ${badgeClass(e.classification)}">${e.classification}</span>
          </div>
        </div>
      `).join("");
        }

        loadEvents();
        setInterval(loadEvents, 5000);
    </script>
</body>

</html>
